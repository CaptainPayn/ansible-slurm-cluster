---
- name: Ensure ufw is installed
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Open slurm and ssh tcp ports in ufw
  community.general.ufw:
    rule: allow
    port: "{{ item | replace('-', ':') }}"
    proto: tcp
  loop: "{{ firewall_tcp_ports }}"

- name: Open nfs traffic from cluster subnet on nfs server in ufw
  community.general.ufw:
    rule: allow
    from_ip: "{{ nfs_export_clients }}"
    port: "{{ item }}"
  loop:
    - "111"
    - "2049"
  when: inventory_hostname in groups['nfs_server']

- name: Ensure ufw is enabled
  community.general.ufw:
    state: enabled
