---
- name: Install munge
  ansible.builtin.package:
    name: munge
    state: present

- name: Ensure /etc/munge permissions
  ansible.builtin.file:
    path: "{{ munge_path }}"
    state: directory
    owner: "{{ munge_path_owner }}"
    group: "{{ munge_path_group }}"
    mode: '0700'

- name: Deploy munge key
  ansible.builtin.copy:
    src: munge.key
    dest: "{{ munge_key_dest }}"
    owner: "{{ munge_path_owner }}"
    group: "{{ munge_path_group }}"
    mode: '0400'
  notify: Restart munge

- name: Enable and start munge
  ansible.builtin.service:
    name: munge
    state: started
    enabled: true
