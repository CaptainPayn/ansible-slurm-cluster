---
- name: Install munge
  ansible.builtin.package:
    name: munge
    state: present

- name: Ensure /etc/munge permissions
  ansible.builtin.file:
    path: /etc/munge
    state: directory
    owner: munge
    group: munge
    mode: '0700'

- name: Deploy munge key
  ansible.builtin.copy:
    src: munge.key
    dest: /etc/munge/munge.key
    owner: munge
    group: munge
    mode: '0400'
  notify: Restart munge

- name: Enable and start munge
  ansible.builtin.service:
    name: munge
    state: started
    enabled: true
