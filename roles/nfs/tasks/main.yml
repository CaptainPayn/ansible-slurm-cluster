---
- name: Configure NFS server
  when: inventory_hostname in groups['nfs_server']
  block:
    - name: Install NFS server packages
      ansible.builtin.package:
        name: nfs-utils
        state: present

    - name: Ensure export directory exists
      ansible.builtin.file:
        path: "{{ nfs_export_path }}"
        state: directory
        owner: "{{ nfs_export_owner }}"
        group: "{{ nfs_export_group }}"
        mode: '0755'

    - name: Deploy /etc/exports
      ansible.builtin.copy:
        dest: /etc/exports
        content: |
          {{ nfs_export_path }} {{ nfs_export_clients }}({{ nfs_export_options }})
        owner: root
        group: root
        mode: '0644'
      notify: Re-export NFS

    - name: Enable and start nfs-server
      ansible.builtin.service:
        name: nfs-server
        state: started
        enabled: true

- name: Configure NFS clients
  when: inventory_hostname not in groups['nfs_server']
  block:
    - name: Install NFS client packages
      ansible.builtin.package:
        name: "{{ 'nfs-utils' if ansible_os_family == 'RedHat' else 'nfs-common' }}"
        state: present

    - name: Mount slurmuser home from the head node
      ansible.posix.mount:
        src: "{{ nfs_server_addr }}:{{ nfs_export_path }}"
        path: "{{ nfs_export_path }}"
        fstype: nfs
        opts: "{{ nfs_mount_opts }}"
        state: mounted
