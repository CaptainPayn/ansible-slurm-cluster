---
- name: Load OS-specific variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Create slurm group with fixed GID
  ansible.builtin.group:
    name: slurm
    gid: 980
    system: true

- name: Create slurm user with fixed UID
  ansible.builtin.user:
    name: slurm
    uid: 980
    group: slurm
    system: true
    shell: /sbin/nologin
    create_home: false

- name: Find compiled Slurm packages for {{ ansible_os_family }}
  ansible.builtin.find:
    paths: "{{ slurm_pkg_dir }}"
    patterns: "{{ slurm_pkg_patterns }}"
  register: found_slurm_pkgs

- name: Verify slurm packages were found
  ansible.builtin.assert:
    that:
      - found_slurm_pkgs.matched == (slurm_pkg_patterns | length)
    fail_msg: "Expected {{ slurm_pkg_patterns | length }} packages in {{ slurm_pkg_dir }}, found {{ found_slurm_pkgs.matched }}"

- name: Install rhel slurm packages from NFS directory
  ansible.builtin.dnf:
    name: "{{ found_slurm_pkgs.files | map(attribute='path') | list }}"
    disable_gpg_check: true
    state: present
  when: ansible_os_family == "RedHat"

- name: Prevent ubuntu upstream repos from overriding local slurm builds
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/slurm-pin
    content: |
      Package: slurm* slurmd slurmctld slurmdbd libslurm*
      Pin: release o=Ubuntu
      Pin-Priority: -1
    owner: root
    group: root
    mode: '0644'
  when: ansible_os_family == "Debian"

- name: Install debian/ubuntu slurm packages from NFS directory
  ansible.builtin.apt:
    deb: "{{ item }}"
    state: present
    allow_downgrade: true
  loop: "{{ found_slurm_pkgs.files | map(attribute='path') | list }}"
  when: ansible_os_family == "Debian"

- name: Ensure slurm config directory exists
  ansible.builtin.file:
    path: /etc/slurm
    state: directory
    owner: slurm
    group: slurm
    mode: '0755'
    
- name: Deploy slurm.conf
  ansible.builtin.template:
    src: slurm.conf.j2
    dest: /etc/slurm/slurm.conf
    owner: slurm
    group: slurm
    mode: '0644'
  notify: slurm config changed
