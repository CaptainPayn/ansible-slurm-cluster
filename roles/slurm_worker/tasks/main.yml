---
- name: Create slurmd spool directory
  ansible.builtin.file:
    path: "{{ slurmd_spool_dir }}"
    state: directory
    owner: slurm
    group: slurm
    mode: '0755'

- name: Deploy cgroup.conf to workers
  ansible.builtin.copy:
    src: "{{ slurm_conf_dir }}/cgroup.conf"
    dest: "{{ slurm_conf_dir }}/cgroup.conf"
    owner: slurm
    group: slurm
    mode: '0644'
  notify: Restart slurmd

- name: Enable and start slurmd
  ansible.builtin.service:
    name: slurmd
    state: started
    enabled: true
