---
- name: Create shared batch group with fixed GID
  ansible.builtin.group:
    name: "{{ slurm_user }}"
    gid: "{{ slurmuser_uid }}"
    state: present

- name: Create shared batch user with fixed UID
  ansible.builtin.user:
    name: "{{ slurm_user }}"
    uid: "{{ slurmuser_uid }}"
    group: "{{ slurm_user }}"
    home: "{{ slurm_shared_home }}"
    shell: /bin/bash
    create_home: "{{ inventory_hostname in groups['nfs_server'] }}"
    state: present

- name: Read batch user passwd entry
  ansible.builtin.getent:
    database: passwd
    key: "{{ slurm_user }}"

- name: Verify batch user UID and GID match across cluster
  ansible.builtin.assert:
    that:
      - getent_passwd[slurm_user][1] | int == slurmuser_uid
      - getent_passwd[slurm_user][2] | int == slurmuser_uid
    fail_msg: "{{ slurm_user }} UID/GID does not match {{ slurmuser_uid }}"
    quiet: true
