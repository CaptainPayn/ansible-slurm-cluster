---
- name: Configure base cluster infrastructure
  hosts: slurm_cluster
  become: true
  gather_facts: true
  roles:
    - common
    - users
    - firewall
    - munge
    - nfs
    - slurm_common
    - role: slurm_controller
      when: "'slurm_head' in group_names"
    - role: slurm_worker
      when: "'slurm_workers' in group_names"
