---
- name: Configure base cluster infrastructure
  hosts: slurm_cluster
  become: true
  gather_facts: true
  roles:
    - common
    - users
    - firewall
    - munge
    - nfs
    - slurm_common

- name: Configure Slurm Cluster Controller
  hosts: slurm_head
  become: true
  gather_facts: false
  roles:
    - slurm_controller

- name: Configure Slurm Worker Nodes
  hosts: slurm_workers
  become: true
  gather_facts: false
  roles:
    - slurm_worker
